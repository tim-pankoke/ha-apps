# Canonical Home Assistant app configuration. Each release copies this folder,
# with version set to the released one, into the public companion repo
# tim-pankoke/ha-apps (.github/scripts/publish-ha-apps.sh).
# Linted by frenck/action-app-linter, which rejects keys that state a default:
# ingress_port is 8099 and init is true by omission.
name: Finanzen
version: "0.4.0"
slug: finance
description: Bank-Umsätze über Enable Banking abrufen und mit Claude kategorisieren.
arch:
  - amd64
image: ghcr.io/tim-pankoke/ha-finance
ingress: true
panel_icon: mdi:finance
panel_admin: false
backup: cold
homeassistant_api: true
options:
  enable_banking_application_id: ""
  enable_banking_private_key: ""
  anthropic_api_key: ""
  claude_model: claude-opus-5-5
  notify_service: ""
  log_level: info
schema:
  enable_banking_application_id: str?
  enable_banking_private_key: password?
  anthropic_api_key: password?
  claude_model: str
  notify_service: str?
  log_level: list(debug|info|warning|error)?
